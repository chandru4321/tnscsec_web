<div class="dialog-container">

  <h2 class="title">Take Action</h2>

  <div class="form-group">
    <label>Name *</label>
    <input [(ngModel)]="approvedByName" type="text" class="input-box small-input">
  </div>

  <div class="form-group">
    <label>PR No *</label>
    <input [(ngModel)]="approvedPrNo" type="text" class="input-box small-input">
  </div>

  <div class="form-group">
    <label>Nature of Approval *</label>
    <input [(ngModel)]="approvedByNature" type="text" class="input-box small-input">
  </div>

  <div class="form-group">
    <label>Remarks *</label>
    <textarea [(ngModel)]="approvedRemarks" class="input-box"></textarea>
  </div>

  <div class="button-row">
    <button class="btn submit-btn" (click)="submit()">Submit</button>
    <button class="btn cancel-btn" (click)="close()">Cancel</button>
  </div>

</div>
